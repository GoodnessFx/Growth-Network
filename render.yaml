# Render blueprint — persistent Node service for the Growth Network API.
# The SQLite database lives on the mounted disk at /data, so data persists
# across deploys/restarts. Health check hits GET /api/health.
services:
  - type: web
    name: growth-network-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/growth-network.db
      - key: ENABLE_DEMO_DATA
        value: "0"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
